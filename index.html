<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My first website, hosted on GitHub Pages.">
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0b1120; color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 640px; padding: 56px 32px; text-align: center;
      background: #111c30; border: 1px solid #263449; border-radius: 24px; }
    .badge { display: inline-block; padding: 8px 14px; border-radius: 999px;
      background: #153c35; color: #86efac; font-size: 14px; }
    h1 { margin: 28px 0 16px; font-size: clamp(40px, 9vw, 72px); letter-spacing: -0.05em; }
    p { color: #b6c4d8; line-height: 1.7; }
    footer { margin-top: 36px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <span class="badge">My website is live</span>
    <h1>Hello, World!</h1>
    <p>Welcome to my very first website.<br>Hosted on GitHub Pages.</p>
    <footer>Built with a little HTML and a lot of possibility.</footer>
  </main>
</body>
</html>
